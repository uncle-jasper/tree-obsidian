# Publishes a GitHub release for the version in manifest.json.
# Run it from the Actions tab (Release → Run workflow), or push a version tag (e.g. 0.17.2, no "v").
# Builds on GitHub and attaches main.js, manifest.json, styles.css and the proof engine.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Version
        id: v
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "tag $GITHUB_REF_NAME but manifest says $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.txt
          gh release create "$V" main.js manifest.json styles.css proof-engine-*.wasm.gz \
            --target "$GITHUB_SHA" --title "$V" --notes-file notes.txt
