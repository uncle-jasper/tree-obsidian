# Publishes a GitHub release when a version tag (e.g. 0.17.2, no "v") is pushed.
# Builds on GitHub and attaches main.js, manifest.json, styles.css and the proof engine.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but manifest says $v"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B > notes.txt
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css proof-engine-*.wasm.gz \
            --title "$GITHUB_REF_NAME" --notes-file notes.txt
